services:
  - type: web
    name: vigil
    runtime: node
    plan: free
    buildCommand: echo "no build step (zero dependencies)"
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Execution: real signed orders on Bitget's paper-trading venue (PAPTRADING:1,
      # virtual funds only). Capability-aware: rTokens are halted in demo -> labelled
      # paper-fallback legs; crypto is venue-filled.
      - key: VIGIL_EXEC
        value: bitget
      # Decision-maker: Qwen (sponsor) wired to the OpenAI-compatible seam.
      # VIGIL_LLM=qwen + VIGIL_QWEN_API_KEY (KYC-provisioned hackathon key).
      - key: VIGIL_LLM
        value: qwen
      - key: VIGIL_QWEN_API_KEY
        sync: false
      - key: VIGIL_LLM_BASE_URL
        value: https://hackathon.bitgetops.com/v1
      - key: VIGIL_LLM_MODEL
        value: qwen3.8-max
      # Bitget demo-venue credentials (paper-trading env, Read+Trade, no withdraw).
      - key: VIGIL_BITGET_API_KEY
        sync: false
      - key: VIGIL_BITGET_SECRET
        sync: false
      - key: VIGIL_BITGET_PASSPHRASE
        sync: false
      - key: VIGIL_SEED_USD
        value: "10000"
      - key: VIGIL_SCAN_MS
        value: "300000"
      # Multi-session Connect: 32+ char random string used to encrypt user books'
      # credentials (AES-256-GCM). WITHOUT this, session keys are ephemeral and
      # connected books become undecryptable after a redeploy — set it in the dashboard.
      - key: VIGIL_SESSION_SECRET
        sync: false
      - key: VIGIL_MAX_SESSIONS
        value: "8"
      # Optional global break-glass webhook (Telegram/Discord/Slack/generic).
      # Per-book webhooks are supplied by users at Connect instead.
      - key: VIGIL_ALERT_WEBHOOK
        sync: false
      - key: VIGIL_ALERT_MOVE_PCT
        value: "3"